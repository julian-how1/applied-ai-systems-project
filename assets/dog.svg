<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Cartoon dog">
  <g fill="#FFFFFF" stroke="#3A2A22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M140 196 Q186 186 178 140 Q172 132 165 140 Q172 172 136 180 Z"/>
    <!-- body -->
    <path d="M58 232 Q48 150 100 134 Q152 150 142 232 Z"/>
    <!-- front legs and paws -->
    <rect x="72" y="178" width="22" height="54" rx="11"/>
    <rect x="106" y="178" width="22" height="54" rx="11"/>
    <ellipse cx="82" cy="231" rx="15" ry="8"/>
    <ellipse cx="118" cy="231" rx="15" ry="8"/>
    <!-- head -->
    <circle cx="100" cy="94" r="48"/>
    <!-- floppy ears -->
    <path d="M60 64 Q36 70 40 118 Q48 136 64 120 Q64 92 72 68 Z"/>
    <path d="M140 64 Q164 70 160 118 Q152 136 136 120 Q136 92 128 68 Z"/>
    <!-- muzzle -->
    <ellipse cx="100" cy="114" rx="25" ry="18"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="70" cy="110" rx="7" ry="4" fill="#FFB38A" opacity="0.7"/>
  <ellipse cx="130" cy="110" rx="7" ry="4" fill="#FFB38A" opacity="0.7"/>
  <!-- eyes -->
  <circle cx="82" cy="86" r="6" fill="#3A2A22"/>
  <circle cx="118" cy="86" r="6" fill="#3A2A22"/>
  <circle cx="84" cy="84" r="2" fill="#FFFFFF"/>
  <circle cx="120" cy="84" r="2" fill="#FFFFFF"/>
  <!-- nose, mouth, tongue -->
  <path d="M96 122 Q100 134 104 122 Z" fill="#FF8A8A" stroke="#3A2A22" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="100" cy="105" rx="9" ry="6.5" fill="#3A2A22"/>
  <path d="M100 111 L100 118 M100 118 Q92 126 85 120 M100 118 Q108 126 115 120" fill="none" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/>
  <!-- collar and tag -->
  <path d="M70 147 Q100 160 130 147" fill="none" stroke="#FF9A5C" stroke-width="8" stroke-linecap="round"/>
  <circle cx="100" cy="160" r="6.5" fill="#FFD166" stroke="#3A2A22" stroke-width="2.5"/>
</svg>
