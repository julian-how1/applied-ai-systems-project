<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Cartoon cat">
  <g fill="#FFFFFF" stroke="#3A2A22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- curled tail -->
    <path d="M136 226 Q192 222 184 160 Q182 146 170 150 Q162 155 167 166 Q176 206 134 208 Z"/>
    <!-- body -->
    <path d="M62 232 Q54 160 100 140 Q146 160 138 232 Z"/>
    <!-- front legs and paws -->
    <rect x="77" y="184" width="18" height="48" rx="9"/>
    <rect x="105" y="184" width="18" height="48" rx="9"/>
    <ellipse cx="86" cy="231" rx="12" ry="6.5"/>
    <ellipse cx="114" cy="231" rx="12" ry="6.5"/>
    <!-- pointy ears (drawn before the head so it covers their base) -->
    <path d="M58 92 L60 40 L96 66 Z"/>
    <path d="M142 92 L140 40 L104 66 Z"/>
  </g>
  <!-- inner ears -->
  <path d="M66 78 L66 52 L86 66 Z" fill="#FFB3BC"/>
  <path d="M134 78 L134 52 L114 66 Z" fill="#FFB3BC"/>
  <!-- head -->
  <ellipse cx="100" cy="100" rx="46" ry="40" fill="#FFFFFF" stroke="#3A2A22" stroke-width="4"/>
  <!-- cheeks -->
  <ellipse cx="72" cy="114" rx="7" ry="4" fill="#FFB38A" opacity="0.7"/>
  <ellipse cx="128" cy="114" rx="7" ry="4" fill="#FFB38A" opacity="0.7"/>
  <!-- eyes -->
  <ellipse cx="83" cy="97" rx="5.5" ry="7.5" fill="#3A2A22"/>
  <ellipse cx="117" cy="97" rx="5.5" ry="7.5" fill="#3A2A22"/>
  <circle cx="85" cy="94" r="2" fill="#FFFFFF"/>
  <circle cx="119" cy="94" r="2" fill="#FFFFFF"/>
  <!-- nose and mouth -->
  <path d="M95 109 L105 109 L100 115 Z" fill="#FF8A9A" stroke="#3A2A22" stroke-width="2" stroke-linejoin="round"/>
  <path d="M100 115 Q94 123 88 119 M100 115 Q106 123 112 119" fill="none" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#3A2A22" stroke-width="2.5" stroke-linecap="round">
    <line x1="76" y1="112" x2="46" y2="106"/>
    <line x1="76" y1="118" x2="46" y2="122"/>
    <line x1="124" y1="112" x2="154" y2="106"/>
    <line x1="124" y1="118" x2="154" y2="122"/>
  </g>
  <!-- collar and bell -->
  <path d="M70 143 Q100 156 130 143" fill="none" stroke="#FF9A5C" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="156" r="7" fill="#FFD166" stroke="#3A2A22" stroke-width="2.5"/>
  <path d="M95 158 L105 158" stroke="#3A2A22" stroke-width="2" stroke-linecap="round"/>
</svg>
